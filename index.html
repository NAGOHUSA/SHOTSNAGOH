<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAGOH Shots - App Store Screenshot Maker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,700;1,300;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- ── TOPBAR ── -->
    <div class="topbar">
        <div class="wordmark">NAGOH <em>Shots</em></div>
        <div class="tagline">App Store Screenshot Maker</div>
        <div class="tsep"></div>
        <div class="tpill">✓ App Store Compliant</div>
        <button class="tbtn" id="downloadBtn" disabled>Download PNG</button>
    </div>

    <!-- ── MAIN CONTENT ── -->
    <div class="main">
        <!-- Canvas Section -->
        <div class="canvas-section">
            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="canvas"></canvas>
            </div>
            <div class="controls">
                <button class="btn btn-primary" id="uploadBtn">Upload Screenshot</button>
                <button class="btn btn-secondary" id="resetBtn">Clear All</button>
            </div>
        </div>

        <!-- Sidebar with Panels -->
        <div class="sidebar">
            <!-- Device Selection Panel -->
            <div class="panel">
                <label class="panel-title">Device Type</label>
                <div class="device-grid" id="deviceGrid"></div>
                <div class="compliance-note">
                    ✓ <span id="selectedDims">1290 × 2796</span><br>
                    <span id="selectedDevice">iPhone 16 Pro</span>
                </div>
            </div>

            <!-- Theme/Palette Panel -->
            <div class="panel">
                <label class="panel-title">Theme</label>
                <div class="form-group">
                    <select id="paletteSelect">
                        <option value="">— No preset yet —</option>
                        <option value="nagoh-classic">NAGOH Classic</option>
                        <option value="modern-minimal">Modern Minimal</option>
                        <option value="vibrant-tech">Vibrant Tech</option>
                        <option value="sunset">Sunset</option>
                        <option value="ocean">Ocean</option>
                        <option value="nature">Nature</option>
                        <option value="dark-mode">Dark Mode</option>
                    </select>
                    <button class="btn btn-secondary" id="savePaletteBtn" style="width: 100%; margin-top: 0.6rem;">+ Save</button>
                </div>
            </div>

            <!-- Colors Panel -->
            <div class="panel">
                <label class="panel-title">Colors</label>
                <div class="color-row">
                    <div class="form-group">
                        <label>Background</label>
                        <input type="color" id="bgColor" value="#fdf8f0">
                    </div>
                    <div class="form-group">
                        <label>Accent</label>
                        <input type="color" id="accentColor" value="#e8524a">
                    </div>
                </div>
                <div class="color-row">
                    <div class="form-group">
                        <label>Text</label>
                        <input type="color" id="textColor" value="#3d2f24">
                    </div>
                </div>
            </div>

            <!-- Background Style Panel -->
            <div class="panel">
                <label class="panel-title">Background Style</label>
                <div class="form-group">
                    <label>Style</label>
                    <div class="bg-style-grid">
                        <button class="style-option active" data-style="solid">Solid</button>
                        <button class="style-option" data-style="gradient">Gradient</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Upload Image</label>
                    <button class="btn btn-secondary" id="bgUploadBtn" style="width: 100%;">Upload Image</button>
                    <span class="hint">or paste from clipboard</span>
                </div>
            </div>

            <!-- Font Panel -->
            <div class="panel">
                <label class="panel-title">Font</label>
                <div class="form-group">
                    <label>Family</label>
                    <select id="fontSelect">
                        <option value="Fraunces, serif">Fraunces</option>
                        <option value="DM Sans, sans-serif">DM Sans</option>
                        <option value="Georgia, serif">Georgia</option>
                        <option value="monospace">Monospace</option>
                    </select>
                </div>
            </div>

            <!-- Image Panel -->
            <div class="panel">
                <label class="panel-title">Image</label>
                <div class="drop-zone" id="dropZone">
                    <div class="drop-zone-text">Pick file or drop on canvas →<br><span class="hint">or paste from clipboard</span></div>
                </div>
            </div>

            <!-- Caption Panel -->
            <div class="panel">
                <label class="panel-title">Caption</label>
                <div class="form-group">
                    <textarea id="captionInput" placeholder="Add text *here*" maxlength="200"></textarea>
                </div>
                <div class="text-controls">
                    <button class="format-btn" id="boldBtn" title="Bold">B</button>
                    <button class="format-btn" id="italicBtn" title="Italic">I</button>
                    <button class="format-btn" id="underlineBtn" title="Underline">U</button>
                    <button class="format-btn" id="strikeBtn" title="Strikethrough">S</button>
                </div>
                <div class="form-group" style="margin-top: 0.8rem;">
                    <label>Size</label>
                    <input type="range" id="fontSize" min="12" max="72" value="24">
                    <div class="info-badge"><span id="fontSizeValue">24</span>px</div>
                </div>
            </div>

            <!-- Text Position Panel -->
            <div class="panel">
                <label class="panel-title">Position</label>
                <div class="position-grid">
                    <button class="position-btn active" data-position="top">Top</button>
                    <button class="position-btn" data-position="middle">Middle</button>
                    <button class="position-btn" data-position="bottom">Bottom</button>
                </div>
            </div>

            <!-- Subtitle Panel -->
            <div class="panel">
                <label class="panel-title">Subtitle</label>
                <textarea id="subtitleInput" placeholder="Add secondary text" maxlength="100" style="min-height: 50px;"></textarea>
            </div>

            <!-- Emojis Panel -->
            <div class="panel">
                <label class="panel-title">Emojis</label>
                <div class="emoji-grid" id="emojiGrid"></div>
            </div>

            <!-- Screenshot Preset Panel -->
            <div class="panel">
                <label class="panel-title">Screenshot</label>
                <div class="form-group">
                    <label>Preset</label>
                    <select id="presetSelect"></select>
                </div>
            </div>

            <!-- Device Frame Panel -->
            <div class="panel">
                <label class="panel-title">Add a Device Frame?</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="frameToggle">
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <!-- Padding Panel -->
            <div class="panel">
                <label class="panel-title">Padding</label>
                <div class="padding-grid">
                    <button class="padding-btn active" data-padding="comfy">Comfy</button>
                    <button class="padding-btn" data-padding="tight">Tight</button>
                    <button class="padding-btn" data-padding="xtight">X-tight</button>
                </div>
            </div>

            <!-- 3D Perspective Panel -->
            <div class="panel">
                <label class="panel-title">3D Perspective <span class="badge">BETA</span></label>
                <input type="range" id="perspectiveSlider" min="0" max="30" value="0">
                <div class="info-badge"><span id="perspectiveValue">0</span>°</div>
            </div>

            <!-- Status Bar Panel -->
            <div class="panel">
                <label class="panel-title">Hide Status Bar</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="hideStatusBarToggle">
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <!-- Translate Panel -->
            <div class="panel">
                <label class="panel-title">Translate</label>
                <button class="btn btn-secondary" id="aiCaptionBtn" style="width: 100%; cursor: not-allowed;" disabled title="Coming soon">
                    🔒 Translate captions with AI
                </button>
                <div class="hint" style="margin-top: 0.5rem; text-align: center;">GENERATE APP STORE-READY CAPTIONS</div>
            </div>
        </div>
    </div>

    <!-- Hidden file inputs -->
    <input type="file" id="fileInput" accept="image/*" style="display: none;">
    <input type="file" id="bgFileInput" accept="image/*" style="display: none;">

    <!-- Scripts (modular) -->
    <script src="js/colors.js"></script>
    <script src="js/devices.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
